<!doctype html> <!-- HTML5 문서 형식을 선언합니다. -->
<html lang="ko"> <!-- 문서의 기본 언어를 한국어로 설정합니다. -->
<head> <!-- 문서 설정 영역을 시작합니다. -->
<meta charset="UTF-8"> <!-- 한글이 깨지지 않도록 문자 인코딩을 설정합니다. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 모바일 화면 너비에 맞춥니다. -->
<title>간단한 계산기</title> <!-- 브라우저 탭에 표시할 제목입니다. -->
<link rel="stylesheet" href="css/style.css"> <!-- 외부 CSS 파일을 연결합니다. -->
</head> <!-- 문서 설정 영역을 끝냅니다. -->
<body> <!-- 계산기 전체 화면을 구성합니다. -->
<main class="calculator" aria-labelledby="calculator-title"> <!-- 계산기 카드 영역을 시작합니다. -->
<header class="calculator-header"> <!-- 계산기 제목 영역을 시작합니다. -->
<span class="eyebrow">QUICK MATH</span> <!-- 계산기의 짧은 설명을 표시합니다. -->
<h1 id="calculator-title">계산기</h1> <!-- 계산기 제목을 표시합니다. -->
<p>간단하고 빠르게 계산해 보세요.</p> <!-- 사용 안내를 표시합니다. -->
</header> <!-- 계산기 제목 영역을 끝냅니다. -->
<output id="display" aria-label="계산 결과" aria-live="polite">0</output> <!-- 계산 결과와 입력을 표시합니다. -->
<div class="button-grid" aria-label="계산기 버튼"> <!-- 버튼을 네 열로 배치합니다. -->
<button type="button" data-action="clear">Clear</button> <!-- 입력과 계산 상태를 지우는 버튼입니다. -->
<button type="button" data-operator="/">÷</button> <!-- 나눗셈 버튼입니다. -->
<button type="button" data-operator="*">×</button> <!-- 곱셈 버튼입니다. -->
<button type="button" data-operator="-">−</button> <!-- 뺄셈 버튼입니다. -->
<button type="button" data-number="7">7</button> <!-- 숫자 7 입력 버튼입니다. -->
<button type="button" data-number="8">8</button> <!-- 숫자 8 입력 버튼입니다. -->
<button type="button" data-number="9">9</button> <!-- 숫자 9 입력 버튼입니다. -->
<button type="button" data-operator="+">+</button> <!-- 덧셈 버튼입니다. -->
<button type="button" data-number="4">4</button> <!-- 숫자 4 입력 버튼입니다. -->
<button type="button" data-number="5">5</button> <!-- 숫자 5 입력 버튼입니다. -->
<button type="button" data-number="6">6</button> <!-- 숫자 6 입력 버튼입니다. -->
<button type="button" data-action="equals">=</button> <!-- 현재 계산을 완료하는 버튼입니다. -->
<button type="button" data-number="1">1</button> <!-- 숫자 1 입력 버튼입니다. -->
<button type="button" data-number="2">2</button> <!-- 숫자 2 입력 버튼입니다. -->
<button type="button" data-number="3">3</button> <!-- 숫자 3 입력 버튼입니다. -->
<button type="button" data-number="0">0</button> <!-- 숫자 0 입력 버튼입니다. -->
</div> <!-- 버튼 배치 영역을 끝냅니다. -->
</main> <!-- 계산기 카드 영역을 끝냅니다. -->
<script src="js/script.js"></script> <!-- 외부 JavaScript 파일을 연결합니다. -->
</body> <!-- 화면 내용을 끝냅니다. -->
</html> <!-- HTML 문서를 끝냅니다. -->
