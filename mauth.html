<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="나의 포트폴리오 로그인 및 회원가입">
  <title>로그인 | 나의 포트폴리오</title>
  <link rel="icon" type="image/png" href="images/portfolio-icon.png">
  <link rel="stylesheet" href="css/mportfolio.css">
</head>
<body>
  <header class="site-header">
    <nav class="nav shell">
      <a class="logo" href="mintro.html">MY PORTFOLIO</a>
      <div class="nav-links">
        <a href="mintro.html">자기소개</a><a href="minfo.html">인적사항</a><a href="mstudy.html">학습사항</a><a href="mcareer.html">경력사항</a><a href="mideas.html">아이디어</a><a class="active" href="mauth.html">로그인</a>
      </div>
    </nav>
  </header>

  <main class="auth-page">
    <section class="auth-intro">
      <p class="kicker">Member access</p>
      <h1>다시 만나서<br>반가워요.</h1>
      <p>로그인하면 아이디어 기록과 회원 정보를 이 브라우저에서 계속 사용할 수 있습니다.</p>
      <div class="auth-note"><strong>학습용 회원 기능</strong><span>회원 정보는 현재 기기의 브라우저에만 저장됩니다. 실제 서비스에서는 서버 인증이 필요합니다.</span></div>
    </section>

    <section class="auth-card" aria-labelledby="authTitle">
      <div class="auth-tabs" role="tablist" aria-label="회원 메뉴">
        <button id="loginTab" class="active" type="button" role="tab" aria-selected="true">로그인</button>
        <button id="signupTab" type="button" role="tab" aria-selected="false">회원가입</button>
      </div>

      <form id="loginForm" class="auth-form">
        <div><p class="kicker">Welcome back</p><h2 id="authTitle">로그인</h2></div>
        <label>이메일<input id="loginEmail" type="email" autocomplete="email" placeholder="name@example.com" required></label>
        <label>비밀번호<input id="loginPassword" type="password" autocomplete="current-password" minlength="6" placeholder="6자 이상 입력" required></label>
        <button class="auth-submit" type="submit">로그인하기</button>
      </form>

      <form id="signupForm" class="auth-form" hidden>
        <div><p class="kicker">Create account</p><h2>회원가입</h2></div>
        <label>이름<input id="signupName" type="text" autocomplete="name" maxlength="20" placeholder="이름 입력" required></label>
        <label>이메일<input id="signupEmail" type="email" autocomplete="email" placeholder="name@example.com" required></label>
        <label>비밀번호<input id="signupPassword" type="password" autocomplete="new-password" minlength="6" placeholder="6자 이상 입력" required></label>
        <label>비밀번호 확인<input id="signupConfirm" type="password" autocomplete="new-password" minlength="6" placeholder="비밀번호 다시 입력" required></label>
        <button class="auth-submit" type="submit">계정 만들기</button>
      </form>

      <section id="accountPanel" class="account-panel" hidden>
        <span class="account-avatar" id="accountAvatar">J</span>
        <p class="kicker">Signed in</p><h2 id="accountName">사용자</h2><p id="accountEmail"></p>
        <a class="account-home" href="mintro.html">포트폴리오로 이동</a>
        <button id="logoutButton" class="account-logout" type="button">로그아웃</button>
      </section>
      <p id="authMessage" class="auth-message" role="status" aria-live="polite"></p>
    </section>
  </main>
  <footer class="site-footer">© 2026 MY PORTFOLIO</footer>
  <script src="auth.js"></script>
  <script src="music.js" defer></script>
</body>
</html>
