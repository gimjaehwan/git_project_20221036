<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="C++ 문법부터 클래스와 객체지향까지 실습하는 입문 강좌">
  <title>C++ 입문 강좌 | MY PORTFOLIO</title>
  <link rel="icon" type="image/png" href="../images/portfolio-icon.png">
  <link rel="stylesheet" href="../css/mportfolio.css">
  <link rel="stylesheet" href="../css/lesson.css">
  <link rel="stylesheet" href="../css/c-course.css">
</head>
<body class="lesson-body c-course-body">
  <header class="lesson-header">
    <a class="lesson-brand" href="mcourses.html"><img src="../images/portfolio-icon.png" alt=""><span>CODE ARCHIVE</span></a>
    <div class="lesson-header-center"><strong>C++ 입문</strong><span id="headerLessonTitle">C++와 첫 프로그램</span></div>
    <a class="exit-course" href="mcourses.html">강좌 나가기</a>
  </header>
  <main class="lesson-layout">
    <aside class="lesson-sidebar" id="lessonSidebar">
      <div class="course-summary"><span class="html-badge">C++</span><div><strong>C++ 입문 강좌</strong><small>8개 단원 · 약 4시간</small></div></div>
      <div class="course-progress"><div><span>전체 진도</span><b id="progressLabel">0%</b></div><div class="progress-track"><i id="progressBar"></i></div></div>
      <nav class="lesson-nav" id="lessonNav" aria-label="C++ 강좌 목차"></nav>
      <button class="reset-progress" id="resetProgress" type="button">학습 기록 초기화</button>
    </aside>
    <article class="lesson-content">
      <button class="mobile-outline" id="mobileOutline" type="button" aria-expanded="false">☰ 강좌 목차</button>
      <header class="lesson-title-block"><p class="lesson-step" id="lessonStep">LESSON 01</p><h1 id="lessonTitle">C++와 첫 프로그램</h1><p id="lessonLead"></p></header>
      <section class="lesson-copy" id="lessonCopy"></section>
      <section class="practice" id="practiceSection">
        <div class="practice-heading"><div><span>PRACTICE</span><h2>코드를 직접 수정해 보세요</h2></div><button id="resetCode" type="button">처음 코드</button></div>
        <div class="practice-grid">
          <div class="editor-panel"><div class="editor-bar"><span>main.cpp · 자동 저장</span><button id="copyLessonCode" type="button">복사</button></div><textarea id="lessonEditor" spellcheck="false" aria-label="C++ 코드 편집기" autocomplete="off"></textarea><button class="run-code" id="runCode" type="button">수정 결과 미리보기 ▶</button></div>
          <div class="preview-panel c-output-panel"><div class="preview-bar"><span>예상 출력</span><i></i></div><iframe id="lessonPreview" title="C++ 코드 예상 출력"></iframe></div>
        </div>
        <p class="compiler-note">코드는 자유롭게 수정되며 자동 저장됩니다. 기본적인 cout, 변수, 객체 메서드 호출은 미리보기로 확인할 수 있습니다. 고급 C++ 문법의 정확한 실행은 C++17 컴파일러를 이용하세요.</p>
        <p class="practice-task" id="practiceTask"></p>
      </section>
      <section class="quiz" id="quizSection" hidden></section>
      <footer class="lesson-footer"><button id="prevLesson" type="button">← 이전 단원</button><button class="complete-lesson" id="completeLesson" type="button">학습 완료</button><button id="nextLesson" type="button">다음 단원 →</button></footer>
    </article>
  </main>
  <div class="lesson-toast" id="lessonToast" role="status" aria-live="polite"></div>
  <script src="../js/cpp-course.js"></script>
</body>
</html>
